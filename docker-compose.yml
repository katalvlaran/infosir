# Development only. Supply DB_PASS and NATS_TOKEN at runtime; no embedded credentials.
services:
  db:
    image: timescale/timescaledb:2.19.0-pg14
    environment:
      POSTGRES_DB: infosir_db
      POSTGRES_USER: infosir
      POSTGRES_PASSWORD: ${DB_PASS:?set DB_PASS}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infosir -d infosir_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  nats:
    image: nats:2.10.11
    command: ["-js", "-sd", "/data", "--auth", "${NATS_TOKEN:?set NATS_TOKEN}"]
    volumes:
      - nats_data:/data
  infosir:
    build: .
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: infosir
      DB_PASS: ${DB_PASS:?set DB_PASS}
      DB_NAME: infosir_db
      NATS_URL: nats://${NATS_TOKEN:?set NATS_TOKEN}@nats:4222
      MARKET: ${MARKET:-spot}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://api.binance.com}
      KLINES_POINT: ${KLINES_POINT:-api/v3/klines}
      PAIRS: ${PAIRS:-BTCUSDT}
      KLINE_INTERVAL: ${KLINE_INTERVAL:-1m}
      SYNC_ENABLED: ${SYNC_ENABLED:-false}
      SYNC_START: ${SYNC_START:-}
      CONFIRM_LEGACY_PROFILE: ${CONFIRM_LEGACY_PROFILE:-false}
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 30s
volumes:
  db_data:
  nats_data:
